<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>document</title>
</head>
<body>

    <style>

body{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica;
  background-color: #1c242f;
  color: white;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 80px;
  
}

.logo {
  font-weight: bold;
  font-size: 18px;
}

.nav-links a {
  text-decoration: none;
  color: #e5e7eb;
  margin-left: 25px;
  font-size: 14px;
  padding-left: -15px;
}

.compane {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 80px;
  gap: 50px;
}

.compane-name h1 {
  font-size: 40px;
  font-weight: 70px;
  color: #f9faf8;
  margin-bottom: 15px;

}

.compane-name p {
  color: #e5e7eb;
  font-size: 14px;
  margin-bottom: 25px;
}

button {
  background-color: #2b76ef;
  color: white;
  border: none;
  padding: 10px 25px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

.image-chailde {
  width: 300px;
  height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
  
   
}          

    </style>
  <header class="header">
    <div class="logo">Header Logo</div>
    <div class="nav-links">
      <a href="">Home</a>
      <a href="">About</a>
      <a href="">Contact</a>
    </div>
  </header>

  <div class="compane">
    <div class="compane-name">
      <h1><i> Eagel oil company</i></h1>
      <p>
        This website has some subtext that goes here under the main title.
        It’s a smaller font and the color is lower contrast.
      </p>
      <button>Sign up</button>
    </div>
    <div class="image-chailde">
    <img src="eagel.webp" alt="">
    </div>
</div>
</body>
</html>
